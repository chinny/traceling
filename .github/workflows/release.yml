name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    # go-fitz statically links its bundled MuPDF via cgo, so each platform
    # builds natively on a matching runner instead of cross-compiling.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        shell: bash
        run: |
          bin=traceling
          [ "${{ matrix.goos }}" = windows ] && bin=traceling.exe
          go build -trimpath \
            -ldflags "-s -w \
              -X main.version=${GITHUB_REF_NAME} \
              -X main.commit=$(git rev-parse --short HEAD) \
              -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "$bin" ./cmd/traceling

      - name: Smoke test
        shell: bash
        run: ./traceling* version

      - name: Package
        shell: bash
        run: |
          name=traceling_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}
          mkdir -p "dist/$name"
          cp README.md LICENSE "dist/$name/"
          if [ "${{ matrix.goos }}" = windows ]; then
            cp traceling.exe "dist/$name/"
            (cd dist && 7z a "$name.zip" "$name" > /dev/null)
          else
            cp traceling "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -r "dist/$name"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
